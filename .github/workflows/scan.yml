name: Kickline scan
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: kickline-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m kickline.run
      - name: Save results
        run: |
          git config user.name "kickline-bot"
          git config user.email "kickline-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
          exit 1
